name: iOS Radar

on:
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run iOS Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IPSW_DEVICE: iPhone16,2
        run: |
          python ios_radar.py --github

      - name: Check if state changed
        id: changes
        run: |
          if git diff --quiet -- state.json web/state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No important state changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Important state changes detected."
          fi

      - name: Commit updated state only if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "ios-radar-bot"
          git config user.email "ios-radar-bot@users.noreply.github.com"

          git add state.json web/state.json
          git commit -m "Update iOS Radar state"
          git push

      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy dashboard to GitHub Pages
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
